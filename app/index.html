<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<title>Workout Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Workout Coach</div>
  <div class="status" id="status"></div>
</header>
<main id="view" class="wrap" aria-live="polite"></main>
<div id="restbar" class="restbar hidden"></div>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h3M18 10h3M6 7v6M18 7v6M8 10h8" /><rect x="5" y="6" width="2" height="8" rx="1"/><rect x="17" y="6" width="2" height="8" rx="1"/></svg>오늘</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>운동</button>
  <button data-tab="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19V11M12 19V5M18 19v-5"/></svg>기록</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>설정</button>
</nav>
<div id="sheet" class="sheet-backdrop hidden"><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
