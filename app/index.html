<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Workout Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Workout Coach</div>
  <div class="status" id="status"></div>
</header>
<main id="view" class="wrap" aria-live="polite"></main>
<div id="restbar" class="restbar hidden"></div>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on">오늘</button>
  <button data-tab="records">기록</button>
  <button data-tab="settings">설정</button>
</nav>
<div id="sheet" class="sheet-backdrop hidden"><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
