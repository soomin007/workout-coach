# main 에 push 하면 단위 테스트를 돌리고 app/ 폴더를 GitHub Pages 로 배포한다.
name: deploy
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/unit/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      # 서비스 워커 캐시 버전을 커밋 해시로: 배포마다 새 캐시로 통째 교체된다
      - run: sed -i "s/const VERSION = 'wc-dev';/const VERSION = 'wc-${GITHUB_SHA::8}';/" app/sw.js && grep -q "wc-${GITHUB_SHA::8}" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
